services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8889:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - ./backend/credentials:/app/backend/credentials:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/backend/credentials/kidenglish-485304-06b70f9353bf.json
    networks:
      - app-network
    depends_on:
      - frontend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'
    container_name: frontend
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app       # 挂载源代码
      - /app/node_modules     # 防止覆盖容器内的 node_modules
    networks:
      - app-network
    command: ["npm", "run", "dev", "--", "--host"]

networks:
  app-network:
    driver: bridge
